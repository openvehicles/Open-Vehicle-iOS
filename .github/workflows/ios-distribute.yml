name: iOS device distribution

on:
  workflow_dispatch:
    inputs:
      bundle_identifier:
        description: Registered App ID used by the provisioning profile
        required: true
        default: com.openvehicles.ovms
        type: string
      upload_to_testflight:
        description: Upload the exported IPA to TestFlight
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  archive:
    name: Signed archive and TestFlight
    runs-on: macos-15
    timeout-minutes: 30
    environment: testflight
    steps:
      - uses: actions/checkout@v5
      - name: Validate signing secrets
        env:
          CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for value in CERTIFICATE CERTIFICATE_PASSWORD PROFILE TEAM_ID; do
            test -n "${!value:-}" || { echo "Missing required secret: $value" >&2; exit 1; }
          done
      - name: Install temporary signing identity
        id: signing
        env:
          CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/ovms-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "profile_name=$profile_name" >> "$GITHUB_OUTPUT"
      - name: Archive signed application
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ inputs.bundle_identifier }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        working-directory: OpenVehicleApp
        run: |
          set -euo pipefail
          xcodebuild -project "Open Vehicle.xcodeproj" -scheme "Open Vehicle" -configuration "AppStore Release" -sdk iphoneos -archivePath "$RUNNER_TEMP/OVMS.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" APS_ENVIRONMENT=production \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive
      - name: Export IPA
        env:
          BUNDLE_ID: ${{ inputs.bundle_identifier }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cp .github/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/OVMS.xcarchive" -exportPath "$RUNNER_TEMP/Export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          test -s "$RUNNER_TEMP/Export/Open Vehicle.ipa"
      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: ovms-device-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/Export/Open Vehicle.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$API_KEY_ID" && test -n "$API_ISSUER_ID" && test -n "$API_PRIVATE_KEY"
          key_directory="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_directory"
          echo "$API_PRIVATE_KEY" | base64 --decode > "$key_directory/AuthKey_$API_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/Export/Open Vehicle.ipa" --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
